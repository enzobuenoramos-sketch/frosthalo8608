<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEHUB PS5</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header-ps">
        <div class="ps-symbols">△ ◯ ✕ ⬜</div>
        <h1>GAMEHUB <span>PS5</span></h1>
        <p>Sua coleção de gameplays e trailers</p>
    </header>

    <!-- CONTAINER DA GALERIA -->
    <main class="gallery-container">

        <!-- CARD 1 -->
        <div class="game-card">
            <div class="card-title">
                <span class="symbol-icon">✕</span>
                <h2>The Last of Us Part II</h2>
            </div>
            <div class="responsive-video">
                <iframe src="https://www.youtube.com/embed/qPNiIeKMHyg" title="The Last of Us 2" allowfullscreen></iframe>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="game-card">
            <div class="card-title">
                <span class="symbol-icon">◯</span>

                <iframe src="https://www.youtube.com/embed/E69tKrfEQag" title="Resident Evil 4 Remake" allowfullscreen></iframe>
